name: Element Agents and Firecracker Lab

on:
    push:
        branches: [codex/firecracker-agent-workspace]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    element-agents:
        name: element-agents
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  runtime: node@26.7.0
                  cache: true
                  install: false

            - name: Install agent dependencies from the lockfile
              run: pnpm --filter @voltdatalab/element-agents install --frozen-lockfile --ignore-scripts

            - name: Prepare the Matrix encryption binding
              run: pnpm rebuild @matrix-org/matrix-sdk-crypto-nodejs

            - name: Check agent types
              run: pnpm --filter @voltdatalab/element-agents lint:types

            - name: Test agents, shared rooms and machine tools
              run: pnpm --filter @voltdatalab/element-agents test:unit

    scoped-memory:
        name: scoped-memory
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        defaults:
            run:
                working-directory: spikes/scoped-memory
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  version: 12.11.2
                  runtime: node@26.7.0
                  working-directory: spikes/scoped-memory
                  cache: true
                  cache-dependency-path: spikes/scoped-memory/pnpm-lock.yaml
                  install: false

            - name: Install isolated experiment tools from its lockfile
              run: pnpm --ignore-workspace install --frozen-lockfile --ignore-scripts

            - name: Check types, boundaries and formatting
              run: |
                  pnpm --ignore-workspace check
                  pnpm --ignore-workspace test
                  pnpm --ignore-workspace format:check

            - name: Exercise the synthetic offline demo
              run: node run.ts

            - name: Measure literal and lexical evidence retrieval
              run: node evaluate.ts

            - name: Prepare the pinned public embedding model
              run: node prepareEmbeddingModel.ts

            - name: Verify real local semantic inference without runtime downloads
              env:
                  ELEMENT_AGENTS_SEMANTIC_INTEGRATION: "1"
              run: pnpm --ignore-workspace exec vitest run --config vitest.config.ts evaluateSemantic.test.ts

            - name: Prepare the pinned public extractive QA model
              run: node prepareQAModel.ts

            - name: Verify real local cited answers and null decisions
              env:
                  ELEMENT_AGENTS_EVIDENCE_INTEGRATION: "1"
              run: pnpm --ignore-workspace exec vitest run --config vitest.config.ts evaluateEvidence.test.ts

    infra-mcp:
        name: infra-mcp
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        defaults:
            run:
                working-directory: spikes/infra-mcp
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  version: 12.11.2
                  runtime: node@26.7.0
                  working-directory: spikes/infra-mcp
                  cache: true
                  cache-dependency-path: spikes/infra-mcp/pnpm-lock.yaml
                  install: false

            - name: Install the isolated MCP experiment
              run: pnpm --ignore-workspace install --frozen-lockfile --ignore-scripts

            - name: Check MCP types, authentication boundaries and formatting
              run: |
                  pnpm --ignore-workspace check
                  pnpm --ignore-workspace test
                  pnpm --ignore-workspace format:check

            - name: Exercise local OAuth and a real MCP SDK client
              run: node run.ts

    firecracker-lab:
        name: firecracker-lab
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Test worker and guest without KVM
              run: python3 -m unittest discover -s apps/agents/firecracker -v

            - name: Check installer and guest init syntax
              run: |
                  bash -n apps/agents/firecracker/install-lab.sh
                  sh -n apps/agents/firecracker/init.sh

            - name: Test Compose configuration and existing state compatibility
              run: python3 apps/agents/test_compose.py -v
