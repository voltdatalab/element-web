name: ${ELEMENT_AGENTS_PROJECT_NAME:-element-agents}
services:
    synapse:
        image: ghcr.io/element-hq/synapse:v1.165.0
        restart: unless-stopped
        volumes:
            - synapse-data:/data
        ports:
            - "127.0.0.1:18008:8008"
    agents:
        build:
            context: ../..
            dockerfile: apps/agents/Dockerfile
        restart: unless-stopped
        environment:
            MATRIX_HOMESERVER: http://synapse:8008
            MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-clawdia-lab.local}
            MATRIX_ADMIN_TOKEN: ${MATRIX_ADMIN_TOKEN:-}
            ELEMENT_AGENTS_ALLOWED_USERS: ${ELEMENT_AGENTS_ALLOWED_USERS-${CLAWDIA_ALLOWED_USERS:-}}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            PI_MODEL: ${PI_MODEL:-}
            PI_PROVIDER: ${PI_PROVIDER:-openai}
            PI_CODEX_ACCESS_FILE: ${PI_CODEX_ACCESS_FILE:-}
        volumes:
            - agents-data:/data
        ports:
            - "127.0.0.1:18787:8787"
        depends_on:
            - synapse
volumes:
    synapse-data:
        name: ${ELEMENT_AGENTS_SYNAPSE_VOLUME:-${COMPOSE_PROJECT_NAME:-element-agents}_synapse-data}
        external: ${ELEMENT_AGENTS_EXTERNAL_VOLUMES:-false}
    agents-data:
        name: ${ELEMENT_AGENTS_STATE_VOLUME:-${COMPOSE_PROJECT_NAME:-element-agents}_agents-data}
        external: ${ELEMENT_AGENTS_EXTERNAL_VOLUMES:-false}
