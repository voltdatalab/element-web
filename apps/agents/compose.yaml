name: clawdia-element-first-slice
services:
    synapse:
        image: ghcr.io/element-hq/synapse:v1.165.0
        restart: unless-stopped
        volumes:
            - synapse-data:/data
        ports:
            - "127.0.0.1:18008:8008"
    agents:
        build:
            context: ../..
            dockerfile: apps/agents/Dockerfile
        restart: unless-stopped
        environment:
            MATRIX_HOMESERVER: http://synapse:8008
            MATRIX_SERVER_NAME: clawdia-lab.local
            MATRIX_ADMIN_TOKEN: ${MATRIX_ADMIN_TOKEN:-}
            CLAWDIA_ALLOWED_USERS: ${CLAWDIA_ALLOWED_USERS:-}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            PI_MODEL: ${PI_MODEL:-}
        volumes:
            - agents-data:/data
        ports:
            - "127.0.0.1:18787:8787"
        depends_on:
            - synapse
volumes:
    synapse-data:
    agents-data:
